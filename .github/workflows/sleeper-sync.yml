name: Fantasy league sync
on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync Sleeper leagues
        run: python sync.py
      - name: Sync ESPN leagues
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python espn_sync.py
      
      - name: Sync Yahoo league
        id: yahoo
        continue-on-error: true
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python yahoo_sync.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update fantasy snapshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Report Yahoo failure after committing other snapshots
        if: ${{ steps.yahoo.outcome == 'failure' }}
        run: |
          echo "::error::Yahoo sync failed; Sleeper and ESPN snapshots were still committed."
          exit 1
